<html lang="en">
<head>

    <style>
        body {
            width: 100%;
            min-height: 100dvh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #page-wrapper {
            width: 100%;
            min-height: 100dvh;
            height: auto;
            display: block;
        }

        #show-sidebar {
            position: fixed !important;
            top: 10px !important;
            right: 8px !important;
            left: auto !important;
            padding: 14px !important;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 0px;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            margin: 0 !important;
            z-index: 10020 !important;
        }

        body.mobile-template #show-sidebar.mobile-menu-toggle {
            width: auto !important;
            min-width: 0 !important;
            height: auto !important;
            padding: 10px !important;
            border-width: 1px !important;
            box-shadow: none !important;
        }

        #mobile-menu-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10010;
            background: rgba(0, 0, 0, 0.68);
            opacity: 1;
            transition: opacity 0.16s ease;
        }

        body.mobile-template.sidebar-is-hidden #mobile-menu-backdrop {
            opacity: 0;
            pointer-events: none;
        }

        body.mobile-template #sidebar {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            z-index: 10015 !important;
            width: calc(100% - 16px) !important;
            max-width: none !important;
            max-height: calc(100dvh - 20px) !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            transform: translate(-50%, -50%) !important;
            box-shadow: none !important;
        }

        body.mobile-template:not(.sidebar-is-hidden) {
            overflow: hidden !important;
        }

        body.mobile-template.sidebar-is-hidden #sidebar {
            max-height: calc(100dvh - 20px) !important;
            transform: translate(-50%, -50%) scale(0.96) !important;
        }

        body.mobile-template #sidebar a,
        body.mobile-template #sidebar #tab,
        body.mobile-template #sidebar #footer-button,
        body.mobile-template #sidebar button {
            box-shadow: none !important;
        }

        #sidebar {
            width: 100%;
            min-width: 0;
            max-width: none;
            height: auto;
            min-height: 0;
            border-right: 0;
            border-bottom: 1px solid var(--border);
            overflow: visible;
            padding-bottom: 12px;
        }

        #header {
            position: relative;
            padding: 14px 14px 12px 14px;
        }

        #hide-sidebar {
            position: absolute;
            top: 50%;
            right: 14px;
            float: none;
            transform: translateY(-50%);
            font-size: 15px;
            padding: 0;
        }

        #subtitle {
            display: inline-block;
            margin-bottom: 2px;
            font-size: 10px;
            line-height: 1.2;
        }

        .mobile-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            padding: 10px 14px 0 14px;
        }

        body.mobile-template .mobile-nav-grid a.mobile-nav-link {
            min-width: 0;
            display: block;
            text-decoration: none;
        }

        body.mobile-template .mobile-nav-grid a.mobile-nav-link > #tab.mobile-nav-button {
            height: 100%;
            min-height: 34px;
            border: 1px solid var(--border) !important;
            border-radius: 0px !important;
            padding: 7px 8px !important;
            text-align: center;
            background: #000000 !important;
            font-size: 13px;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        body.mobile-template .mobile-nav-grid a.mobile-nav-link > #tab.mobile-nav-button:hover {
            background-color: #000000 !important;
        }

        body.mobile-template .mobile-nav-grid a.mobile-nav-link > #tab.mobile-nav-button.active {
            background-color: var(--subtle) !important;
            color: var(--bg) !important;
            border-color: var(--subtle) !important;
            box-shadow: none;
        }

        #user-greeting {
            padding: 10px 14px 0 14px;
            font-size: 11px;
        }

        #sidebar-spacer {
            display: none;
        }

        #mini-player-tracks,
        #mini-player,
        #sidebar-footer {
            margin: 10px 14px 0 14px;
            width: auto;
            border: 1px solid var(--border);
            border-radius: 0px !important;
            background: rgba(8, 8, 8, 0.82);
        }

        #mini-player-tracks,
        #mini-player {
            max-height: none;
            overflow: hidden;
        }

        #mini-player {
            padding: 10px;
        }

        #mini-player-main {
            align-items: flex-start;
            gap: 6px;
        }

        body.mobile-template #header + #mini-player-tracks,
        body.mobile-template #header + #mini-player-tracks + #mini-player,
        body.mobile-template #header + #mini-player {
            margin-top: 0;
        }

        #mini-player-controls {
            min-width: 14px;
            padding: 0;
        }

        #mini-player-volume-wrapper:hover #mini-player-volume,
        #mini-player-volume {
            width: 34px;
            opacity: 1;
        }

        #sidebar-footer {
            padding: 10px;
        }

        #container {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        #content {
            max-width: none;
            width: 100%;
            height: auto;
            padding: 14px;
            box-sizing: border-box;
        }

        #content-layout {
            min-height: 0;
            gap: 14px;
        }

        #content-main {
            width: 100%;
            min-width: 0;
            padding: 0; 
            border: 0px solid var(--border);
            border-radius: 0px;
            background: #000;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #content-main > *:first-child {
            margin-top: 0;
        }

        #content-main > *:last-child {
            margin-bottom: 0;
        }

        #content-footer {
            margin-top: 0;
            padding: 0 2px 2px 2px;
        }

        #footer-text {
            font-size: 11px;
            margin-bottom: 8px;
        }

        #content-footer-views {
            font-size: 11px;
        }

        body.mobile-template #content-main #homepage-hero-ascii {
            display: none;
        }

        body.mobile-template #content-main #ascii-time {
            font-size: 10px !important;
            line-height: 1.05;
        }

        body.mobile-template #content-main #ascii-time-label {
            font-size: 10px !important;
        }

        #content.content-scrolls #content-footer {
            margin-top: 0;
            margin-bottom: 0;
        }

        pre,
        code,
        table,
        img,
        iframe,
        video {
            max-width: 100%;
        }

        #content-main pre {
            overflow-x: auto;
        }

        body.mobile-template #content-main #ascii,
        body.mobile-template #content-main #ascii-time,
        body.mobile-template #content-main .usage-ascii {
            overflow-x: hidden !important;
            overflow-y: hidden !important;
        }

        @media (max-width: 420px) {
            .mobile-nav-grid {
                grid-template-columns: 1fr;
            }

            #content {
                padding: 10px;
            }

            #content-main {
                padding: 12px 11px;
                border-radius: 0px;
            }
        }

        html.mobile-menu-is-open,
        html.mobile-menu-is-open body.mobile-template {
            width: 100% !important;
            height: 100dvh !important;
            overflow: hidden !important;
            overscroll-behavior: none;
        }

        body.mobile-template #sidebar {
            border: 1px solid var(--border) !important;
            box-sizing: border-box !important;
            opacity: 1 !important;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1) !important;
            transition: opacity 0.18s ease, transform 0.2s ease, visibility 0s linear 0s !important;
        }

        body.mobile-template.sidebar-is-hidden #sidebar {
            border: 1px solid var(--border) !important;
            max-height: calc(100dvh - 20px) !important;
            opacity: 0 !important;
            visibility: hidden;
            transform: translate(-50%, -50%) scale(0.96) !important;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.18s ease, visibility 0s linear 0.18s !important;
        }

        html.access-reduced-motion #mobile-menu-backdrop,
        html.access-reduced-motion body.mobile-template #sidebar {
            transition: none !important;
        }

        @media (prefers-reduced-motion: reduce) {
            #mobile-menu-backdrop,
            body.mobile-template #sidebar {
                transition: none !important;
            }
        }

        /* Compact mobile player: artwork left, readable metadata and controls right. */
        body.mobile-template #sidebar #mini-player {
            margin: 10px 8px 0 !important;
            padding: 10px !important;
            width: auto !important;
            overflow: hidden !important;
            border: 1px solid var(--border) !important;
            background: color-mix(in srgb, var(--bg) 92%, var(--links) 8%) !important;
            box-shadow: none !important;
        }

        body.mobile-template #sidebar #mini-player-main {
            position: relative;
            display: grid !important;
            grid-template-columns: 64px minmax(0, 1fr) !important;
            align-items: center !important;
            gap: 10px !important;
        }

        body.mobile-template #sidebar #mini-player-art-wrapper {
            width: 64px !important;
            height: 64px !important;
            margin: 0 !important;
            align-self: center !important;
        }

        body.mobile-template #sidebar #mini-player-art {
            border-color: var(--border) !important;
            box-sizing: border-box;
        }

        body.mobile-template #sidebar #mini-player-download {
            inset: auto 2px 2px auto !important;
            width: 22px;
            height: 22px;
            border: 0 !important;
            box-sizing: border-box;
            background: transparent !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            font-size: 10px !important;
            text-shadow: 0 1px 2px var(--bg), 0 0 3px var(--bg);
        }

        body.mobile-template #sidebar #mini-player-meta {
            min-width: 0 !important;
            gap: 3px !important;
        }

        body.mobile-template #sidebar #mini-player-title {
            padding-right: 24px !important;
            line-height: 1.2;
        }

        body.mobile-template #sidebar #mini-player-title-inner {
            max-width: 100%;
            color: var(--fg) !important;
            font-family: "MainBold", var(--emoji-font), monospace !important;
            font-size: 12px !important;
        }

        body.mobile-template #sidebar #mini-player-artist {
            color: var(--subtle) !important;
            font-size: 10px !important;
        }

        body.mobile-template #sidebar #mini-player-row {
            display: grid !important;
            grid-template-columns: 24px minmax(0, 1fr) !important;
            align-items: center !important;
            gap: 8px !important;
            margin-top: 5px;
        }

        body.mobile-template #sidebar #mini-player-play,
        body.mobile-template #sidebar #mini-player-mute {
            width: 24px !important;
            min-width: 24px !important;
            height: 24px !important;
            border: 0 !important;
            box-sizing: border-box;
            background: transparent !important;
            color: var(--fg) !important;
            font-size: 15px !important;
            line-height: 1 !important;
        }

        body.mobile-template #sidebar #mini-player-seek,
        body.mobile-template #sidebar #mini-player-volume {
            position: static !important;
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            height: 4px !important;
            margin: 0 !important;
            opacity: 1 !important;
            align-self: center !important;
        }

        body.mobile-template #sidebar #mini-player-volume-wrapper {
            display: none !important;
        }

        body.mobile-template #sidebar #mini-player-row.mini-player-volume-expanded #mini-player-volume-wrapper {
            display: none !important;
        }

        body.mobile-template #sidebar #mini-player-row.mini-player-volume-expanded #mini-player-seek {
            display: block !important;
        }

        body.mobile-template #sidebar #mini-player-volume {
            grid-column: 3;
            order: initial !important;
            animation: none !important;
        }

        body.mobile-template #sidebar #mini-player-mute {
            grid-column: 4;
            animation: none !important;
            font-size: 14px !important;
        }

        body.mobile-template #sidebar #mini-player-controls {
            position: absolute !important;
            top: -2px !important;
            right: -2px !important;
            min-width: 0 !important;
            padding: 0 !important;
        }

        body.mobile-template #sidebar #mini-player-close {
            width: 20px !important;
            min-width: 20px !important;
            height: 20px !important;
            min-height: 20px !important;
            border: 1px solid var(--border) !important;
            background: var(--bg) !important;
            color: var(--subtle) !important;
        }

        body.mobile-template #sidebar #mini-player-tracks {
            margin: 10px 8px 0 !important;
            padding: 8px !important;
            width: auto !important;
            max-height: 112px !important;
            border: 1px solid var(--border) !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="mobile-template sidebar-is-hidden">

<div id="mobile-menu-backdrop" aria-hidden="true"></div>
<span id="show-sidebar" class="mobile-menu-toggle" data-tooltip="toggle menu" role="button" tabindex="0" aria-controls="sidebar" aria-expanded="false" aria-label="show menu" style="display:none"><i class="fa-solid fa-bars"></i></span>

<div id="page-wrapper">

<div id="sidebar">

    <div id="header">
        <span id="title" aria-label="fridge"><span class="title-letter" aria-hidden="true">f</span><span class="title-letter" aria-hidden="true">r</span><span class="title-letter" aria-hidden="true">i</span><span class="title-letter" aria-hidden="true">d</span><span class="title-letter" aria-hidden="true">g</span><span class="title-letter" aria-hidden="true">e</span></span>

    </div>

    <div id="mini-player-tracks"></div>

    <div id="mini-player" class="mini-inactive">
        <div id="mini-player-main">
            <div id="mini-player-art-wrapper">
                <img id="mini-player-art" src=""/>
                <span id="mini-player-download" data-tooltip="download track"><i class="fa-solid fa-download"></i></span>
            </div>
            <div id="mini-player-meta">
                <div id="mini-player-title"><span id="mini-player-title-inner">nothing selected</span></div>
                <div id="mini-player-artist">&nbsp;</div>
                <div id="mini-player-row">
                    <span id="mini-player-play" data-tooltip="play / pause"><i class="fa-solid fa-play"></i></span>
                    <input id="mini-player-seek" type="range" min="0" max="0" value="0" step="0.1">
                    <span id="mini-player-volume-wrapper">
                        <span id="mini-player-mute" data-tooltip="mute / unmute"><i class="fa-solid fa-volume-high"></i></span>
                        <input id="mini-player-volume" type="range" min="0" max="1" step="0.01" value="1">
                    </span>
                </div>
            </div>
            <div id="mini-player-controls">
                <button id="mini-player-close" type="button" data-tooltip="close player" aria-label="close music player"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <audio id="mini-player-audio" preload="none"></audio>
    </div>

    <div class="mobile-nav-grid">
        <a class="mobile-nav-link" href="/feed"><div id="tab" class="mobile-nav-button" data-tooltip="short snippets and updates">feed</div></a>
        <a class="mobile-nav-link" href="/journal"><div id="tab" class="mobile-nav-button" data-tooltip="long-form updates and blog posts">journal</div></a>
        <a class="mobile-nav-link" href="/contact"><div id="tab" class="mobile-nav-button" data-tooltip="send a contact message">contact</div></a>
        <a class="mobile-nav-link" href="/guestbook"><div id="tab" class="mobile-nav-button" data-tooltip="leave a message about the website">guestbook</div></a>
        <a class="mobile-nav-link" href="/music"><div id="tab" class="mobile-nav-button" data-tooltip="listen to my music">music</div></a>
        <a class="mobile-nav-link" href="/gallery"><div id="tab" class="mobile-nav-button" data-tooltip="a listing of all images uploaded to the site">gallery</div></a>
        <a class="mobile-nav-link" href="/merch"><div id="tab" class="mobile-nav-button" data-tooltip="buy some of my merch">merch</div></a>
        <a class="mobile-nav-link" href="/bookmarks"><div id="tab" class="mobile-nav-button" data-tooltip="all the stuff you've saved">saves</div></a>
        <a class="mobile-nav-link" href="/tools"><div id="tab" class="mobile-nav-button" data-tooltip="web tools and utilities">tools</div></a>
        <a class="mobile-nav-link" href="/others"><div id="tab" class="mobile-nav-button" data-tooltip="content that doesn't fit elsewhere">others</div></a>
    </div>

    {user_greeting}
    <div id="sidebar-spacer"></div>

    <div id="sidebar-footer">
        <span id="footer-text">© <span id="footer-year"></span> fridge.dev</span>
        <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
        <div id="footer-buttons">
            <a class="mobile-footer-link" href="/"><div id="footer-button" class="mobile-footer-button" data-tooltip="go to homepage"><i class="fa-solid fa-home"></i></div></a>
            <a class="mobile-footer-link" href="/discord"><div id="footer-button" class="mobile-footer-button" data-tooltip="join the community discord"><i class="fa-brands fa-discord"></i></div></a>
            <a class="mobile-footer-link" href="/account"><div id="footer-button" class="mobile-footer-button" data-tooltip="access your fridge.dev account"><i class="fa-solid fa-user"></i></div></a>
            <a class="mobile-footer-link" href="/settings"><div id="footer-button" class="mobile-footer-button" data-tooltip="user settings"><i class="fa-solid fa-wrench"></i></div></a>
        </div>
    </div>

</div>
