<style>
    #wiki-rendered > :first-child {
        margin-top: 0;
    }

    #wiki-rendered h1 {
        margin: 0 0 16px;
        font-family: "MainBold", var(--emoji-font), monospace;
        font-size: 20px;
        color: var(--fg);
    }

    #wiki-rendered h2 {
        margin: 28px 0 10px;
        font-family: "MainBold", var(--emoji-font), monospace;
        font-size: 18px;
        color: var(--fg);
    }

    #wiki-rendered h3 {
        margin: 22px 0 8px;
        font-family: "MainBold", var(--emoji-font), monospace;
        font-size: 16px;
        color: var(--fg);
    }

    #wiki-rendered h4,
    #wiki-rendered h5,
    #wiki-rendered h6 {
        margin: 18px 0 6px;
        color: var(--fg);
    }

    #wiki-rendered p,
    #wiki-rendered ul,
    #wiki-rendered ol,
    #wiki-rendered pre,
    #wiki-rendered blockquote {
        margin: 0 0 14px;
    }

    #wiki-rendered ul,
    #wiki-rendered ol {
        padding-left: 26px;
    }

    #wiki-rendered li {
        margin-bottom: 6px;
    }

    #wiki-rendered :not(pre) > code {
        padding: 1px 4px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 82%, var(--fg) 18%);
        font-family: "MainRegular", var(--emoji-font), monospace;
    }

    #wiki-rendered pre {
        max-width: 100%;
        overflow-x: auto;
    }

    #wiki-rendered blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--border);
        color: var(--subtle);
    }

    #wiki-rendered hr {
        margin: 22px 0;
        border: 0;
        border-top: 1px solid var(--border);
    }
</style>

<div id="wiki-rendered">
    {wiki_page_content}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (!window.hljs) return;
    document.querySelectorAll('#wiki-rendered pre code').forEach(function(block) {
        window.hljs.highlightElement(block);
    });
});
</script>
