<h1>create journal post</h1>
<h2>create a new post for the journal</h2>
<br>
<form id="create-post-form" method="POST" action="/journal/create/" enctype="multipart/form-data">
<input id="textbox" type="text" name="title" placeholder="title">
<br><br>
<textarea id="textbox" class="large" type="text" name="description" placeholder="description" style="height: 54px;"></textarea>
<br><br>
<label class="journal-card-image-field">
    <span>card image <small>(optional; otherwise the first post image is used)</small></span>
    <input name="card_image" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
</label>
<br><br>
{markdown_editor}
<br><br>
<button id="two-buttons" type="submit" name="save_draft" value="1">save draft</button><button id="two-buttons" type="submit" data-post-submit-wait>post</button>
<br><br>
<h3>drafts</h3><br>
<div id="drafts">
<style>
    a.journal-draft-link,
    a.journal-draft-link:visited,
    a.journal-draft-link:hover,
    a.journal-draft-link:active {
        text-decoration: none;
    }
    /* Remove hr-style border from draft headers */
    #drafts #post-header {
        border-bottom: none;
        padding-bottom: 0;
        margin-bottom: 4px;
    }
</style>
{drafts}
</div>
</form>
