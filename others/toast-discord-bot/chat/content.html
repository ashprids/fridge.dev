<style id="chat-final-theme-overrides">#content-footer{display:none!important}body .chat-view{--chat-own-bg:#245856;--chat-own-fg:#fff}body .chat-view .chat-message-own{background:#245856!important;background-image:none!important;color:#fff!important}body .chat-view .chat-message-own .chat-message-meta,body .chat-view .chat-message-own .chat-message-body,body .chat-view .chat-message-own .chat-attachment{color:#fff!important}body .chat-view .chat-reply-reference,body .chat-view .chat-reply-compose{background:#252b30!important;background-image:none!important;color:#fff!important}body .chat-view .chat-reply-reference strong,body .chat-view .chat-reply-reference span,body .chat-view .chat-reply-compose strong,body .chat-view .chat-reply-compose span{color:#fff!important}</style>
<section class="chat-view" data-chat-id="{chat_id}" data-chat-endpoint="{route}" data-chat-view-path="{route}" data-image-only="1" data-csrf="{csrf}" data-send-blocked="{send_blocked}" data-quota-reached="{quota_reached}" data-can-manage="0" data-posting-restricted="{posting_restricted}" data-viewer-role="visitor" data-recipient-name="toast" data-show-recipient-intro="0" data-account-linked-recipient="0"><div class="chat-header-row"><div class="chat-header-main"><h2>fridge.dev chat</h2><div class="chat-presence" id="chat-presence" aria-live="polite">checking if toast is online...</div></div>
<div class="chat-header-actions"><button type="button" class="toast-clear-chat danger-button chat-delete-button">clear chat</button></div></div>
<div class="chat-messages-wrap"><div class="chat-messages" id="chat-messages" aria-live="polite">{messages}</div><div class="chat-typing-indicator" id="chat-typing-indicator" aria-live="polite"></div>
</div>{posting_notice}
<form class="chat-send-form" method="post" action="{route}" enctype="multipart/form-data" data-no-spa="1"><input type="hidden" name="action" value="send"><input type="hidden" name="csrf" value="{csrf}"><input type="hidden" name="replyTo" value=""><div class="chat-reply-compose" aria-live="polite"><div><strong></strong><span></span></div>
<button type="button" aria-label="cancel reply">x</button></div>
<input class="chat-attachment-input" name="attachment" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden{disabled}><button class="chat-attach-button" type="button" data-tooltip="add image" aria-label="add image"{disabled}><i class="fa-solid fa-plus" aria-hidden="true"></i></button><div class="chat-attach-menu"><button type="button" data-chat-compose-action="upload"><i class="fa-solid fa-image"></i><span>upload image</span></button></div>
<textarea name="message" rows="2" maxlength="4000" placeholder="message"{disabled}></textarea><button class="chat-emoji-button" type="button" data-tooltip="emoji"{disabled}>☺</button><button class="chat-send-button" type="submit"{disabled}><span>send</span><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button><div class="chat-file-indicator" aria-live="polite"></div>
</form><div class="chat-context-menu" role="menu"><button type="button" data-chat-action="reply">reply</button><button type="button" data-chat-action="react">react</button><button type="button" data-chat-action="delete">delete</button></div>
<div class="chat-emoji-picker"><input class="chat-emoji-search" type="search" placeholder="search emoji" autocomplete="off"><div class="chat-emoji-grid"></div>
</div>
<script src="/js/chat-conversation.js?v=20260915-namespace-1"></script></section>
